name: Actualizar tutorías guardadas

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-tutorias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leer el repositorio de contenidos digitales
        run: python scripts/actualizar_tutorias.py
      - name: Guardar los cambios
        run: |
          if [ -n "$(git status --porcelain data/tutorias.json)" ]; then
            git config user.name "actualizador-tutorias"
            git config user.email "actions@users.noreply.github.com"
            git add data/tutorias.json
            git commit -m "Actualiza las listas de tutorías guardadas"
            git push
          else
            echo "Sin cambios en las tutorías"
          fi
